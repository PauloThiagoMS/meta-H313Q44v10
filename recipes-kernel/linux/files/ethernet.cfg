CONFIG_NETDEVICES=y
CONFIG_ETHERNET=y

# PHY
CONFIG_PHYLIB=y
CONFIG_GENERIC_PHY=y
CONFIG_FIXED_PHY=y

# PHY drivers
CONFIG_REALTEK_PHY=y
CONFIG_MICREL_PHY=y
CONFIG_SMSC_PHY=y

# MDIO
CONFIG_MDIO_BUS=y
CONFIG_MDIO_DEVICE=y

# STMMAC / DesignWare
CONFIG_NET_VENDOR_STMICRO=y
CONFIG_STMMAC_ETH=y
CONFIG_STMMAC_PLATFORM=y

# Allwinner H616 Ethernet
CONFIG_DWMAC_GENERIC=y
CONFIG_DWMAC_SUNXI=y
CONFIG_DWMAC_SUN8I=y